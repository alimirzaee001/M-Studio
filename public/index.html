<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M Studio — Office for Architecture</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="page">
    <header class="top-bar">
      <div class="brand-column">
        <div class="brand">
          <div class="brand-identity">
            <h1 class="brand-title">
              <img
                src="/assets/logo-wordmark.svg"
                alt="M Studio — Seyed Morteza Mobini"
                class="brand-logo"
                width="320"
                height="43"
                draggable="false"
              />
            </h1>
          </div>
        </div>

        <div class="gallery-chrome">
          <a href="#" class="m-group-link">
            <span class="m-group-char">M</span><span class="m-group-rest"> GROUP</span>
          </a>
          <div class="lang-switch">
            <button type="button" class="lang-btn" data-lang="en">EN</button>
            <span class="lang-sep">/</span>
            <button type="button" class="lang-btn active" data-lang="fa">FA</button>
          </div>
        </div>
      </div>

      <nav class="box-stack" aria-label="Primary">
        <a href="#" class="nav-box nav-box--logo" aria-label="M Studio">
          <img src="/assets/logo-stamp.svg" alt="M Studio" draggable="false" />
        </a>
        <a href="#" class="nav-box nav-box--logo" aria-label="M Group">
          <img src="/assets/logo-mark.svg" alt="M Group" draggable="false" />
        </a>
        <div class="magnifier-slot">
          <button
            type="button"
            class="nav-box nav-box--magnifier"
            id="magnifier-toggle"
            aria-label="Magnifying glass"
            aria-pressed="false"
          >
            <img
              class="magnifier-btn-icon magnifier-btn-icon--zoom"
              src="/assets/magnifier-icon.svg"
              alt=""
              width="22"
              height="22"
              draggable="false"
            />
            <svg
              class="magnifier-btn-icon magnifier-btn-icon--close"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              aria-hidden="true"
            >
              <line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" />
              <line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2.5" />
            </svg>
          </button>
        </div>
        <button
          type="button"
          class="nav-box nav-box--menu"
          id="menu-toggle"
          aria-label="Menu"
          aria-expanded="false"
          aria-controls="site-menu"
        >
          <span class="menu-icon"><span></span><span></span><span></span></span>
        </button>

        <div class="project-dropdown site-menu" id="site-menu" role="menu" aria-hidden="true" hidden>
          <ul class="project-list site-menu-list" id="site-menu-list">
            <li>
              <button type="button" class="project-list-item site-menu-item" data-action="home" role="menuitem" data-i18n="home">
                Home
              </button>
            </li>
            <li>
              <button type="button" class="project-list-item site-menu-item" data-action="about" role="menuitem" data-i18n="about">
                About Us
              </button>
            </li>
            <li>
              <button type="button" class="project-list-item site-menu-item" data-action="contact" role="menuitem" data-i18n="contact">
                Contact Us
              </button>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <div class="projects-viewport" id="projects-viewport">
      <div class="projects-track" id="projects-track"></div>
    </div>

    <div class="project-detail" id="project-detail" aria-hidden="true" hidden>
      <div class="section-viewport" id="section-viewport">
        <div class="section-loader" id="section-loader" aria-hidden="true" aria-live="polite">
          <div class="section-loader-spinner" role="status" aria-label="Loading section images"></div>
        </div>
        <div class="section-track" id="section-track"></div>
      </div>
      <aside class="project-sidebar">
        <div class="project-sidebar-meta">
          <h2 class="project-sidebar-title" id="project-detail-title"></h2>
          <p class="project-sidebar-desc" id="project-detail-desc"></p>
        </div>
        <nav class="project-section-nav" id="project-section-nav" aria-label="Project sections"></nav>
      </aside>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden aria-hidden="true">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <img class="lightbox-img" id="lightbox-img" alt="" draggable="false" />
  </div>

  <!-- CMS page modal: HTML from admin is trusted and injected via innerHTML -->
  <div class="page-modal" id="page-modal" hidden aria-hidden="true">
    <div class="page-modal-backdrop" id="page-modal-backdrop"></div>
    <div
      class="page-modal-dialog"
      id="page-modal-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="page-modal-title"
    >
      <button type="button" class="page-modal-close" id="page-modal-close" aria-label="Close">&times;</button>
      <h2 class="page-modal-title" id="page-modal-title"></h2>
      <div class="page-modal-body" id="page-modal-body"></div>
    </div>
  </div>

  <div id="magnifier-root" class="magnifier-root" hidden aria-hidden="true">
    <div class="magnifier-lens" id="magnifier-lens">
      <div class="magnifier-lens-inner" id="magnifier-lens-inner"></div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
